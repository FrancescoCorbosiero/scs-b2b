; Configurazione applicativa PHP (prod-oriented; il dev override sta nel compose)
date.timezone = Europe/Rome
memory_limit = 256M
; 12M: appena sopra il tetto applicativo di 10 MB dell'upload etichette
; dropship (docs/09), così l'errore "file troppo grande" lo dà l'app
upload_max_filesize = 12M
post_max_size = 12M
expose_php = Off
display_errors = Off
log_errors = On
error_log = /var/www/html/logs/php-error.log

; Sessioni
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax

; OPcache
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 10000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 60
